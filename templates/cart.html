<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Your Cart</h1>
    </header>

    <main>
        <section id="cart-page">
            <h1>Your Shopping Cart</h1>
            <div class="cart-container">
                <div class="cart-items">
                    <!-- Example cart item -->
                    <div class="cart-item">
                        <img src="{{ url_for('static', filename='images/sample-product.jpg') }}" alt="Product Image">
                        <div class="item-details">
                            <h3>Product Name</h3>
                            <p>Quantity: 1</p>
                            <p>Price: $50</p>
                        </div>
                        <button class="remove-item">Remove</button>
                    </div>
                </div>
                <div class="cart-summary">
                    <h2>Order Summary</h2>
                    <p>Total Items: 3</p>
                    <p>Total Price: $150</p>
                    <button class="btn checkout-btn">Proceed to Payment</button>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <style>
        #cart-page {
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-container {
            display: flex;
            gap: 2rem;
        }

        .cart-items {
            flex: 2;
            background: var(--card);
            padding: 2rem;
            border-radius: 8px;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--muted);
            padding-bottom: 1rem;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            flex: 1;
        }

        .remove-item {
            background: var(--red);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-summary {
            flex: 1;
            background: var(--card);
            padding: 2rem;
            border-radius: 8px;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background: var(--red);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</body>
</html>
