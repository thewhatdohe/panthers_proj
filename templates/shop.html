<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>My Shop</h1>
        <!-- Cart link -->
        <a class="cart-link" href="#">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>

        <!-- Cart drawer -->
        <div id="cart-drawer" class="drawer">
            <div id="cart-items">
                <p>Your cart is empty.</p>
            </div>
        </div>
    </header>

    <main>
        <h2>Products</h2>
        <div class="product">
            <p>Apple - AED 5</p>
            <button onclick="addToCart('Apple', 5)">Add to Cart</button>
        </div>
        <div class="product">
            <p>Banana - AED 3</p>
            <button onclick="addToCart('Banana', 3)">Add to Cart</button>
        </div>
    </main>

    <script src="/static/main.js"></script>
</body>
</html>
